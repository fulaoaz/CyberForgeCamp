<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - CyberForgeCamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.16), transparent 28%),
                linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-6xl items-center px-4 py-10 sm:px-6 lg:px-8">
        <div class="grid w-full gap-6 lg:grid-cols-[1.1fr_0.9fr]">
            <section class="rounded-[2rem] border border-white/70 bg-white/75 p-8 shadow-2xl shadow-slate-300/35 backdrop-blur-xl sm:p-10">
                <p class="mono text-sm font-semibold text-blue-600">CyberForgeCamp / Admin Access</p>
                <h1 class="mt-4 text-4xl font-bold tracking-tight text-slate-950 sm:text-5xl">管理员登录入口</h1>
                <p class="mt-4 max-w-xl text-base leading-7 text-slate-600">这里保留为后续管理员系统接入点。当前页面仅提供静态入口与表单样式，便于之后接入账号认证、内容管理和站点维护。</p>
                <div class="mt-8 grid gap-3 sm:grid-cols-3">
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                        <div class="text-sm font-semibold text-slate-900">内容维护</div>
                        <div class="mt-1 text-sm text-slate-500">教程、公告、资源入口</div>
                    </div>
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                        <div class="text-sm font-semibold text-slate-900">链接管理</div>
                        <div class="mt-1 text-sm text-slate-500">友链、反馈、群聊接入</div>
                    </div>
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                        <div class="text-sm font-semibold text-slate-900">站点配置</div>
                        <div class="mt-1 text-sm text-slate-500">入口预留，后续扩展</div>
                    </div>
                </div>
                <a href="../index.html" class="mt-8 inline-flex items-center justify-center rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-blue-400 hover:text-blue-600 hover:shadow-md">返回首页</a>
            </section>
            <section class="rounded-[2rem] border border-slate-200/80 bg-slate-950 p-6 text-white shadow-2xl shadow-slate-400/20 sm:p-8">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="mono text-xs uppercase tracking-[0.24em] text-blue-300">Reserved Portal</p>
                        <h2 class="mt-2 text-2xl font-bold">登录表单</h2>
                    </div>
                    <div class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-slate-300">Preview</div>
                </div>
                <form class="mt-8 space-y-5" onsubmit="event.preventDefault(); alert('当前为预留静态入口，后续接入真实管理员认证。');">
                    <label class="block">
                        <span class="mb-2 block text-sm font-medium text-slate-200">管理员账号</span>
                        <input type="text" placeholder="admin" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-400 focus:bg-white/10">
                    </label>
                    <label class="block">
                        <span class="mb-2 block text-sm font-medium text-slate-200">登录密码</span>
                        <input type="password" placeholder="••••••••" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-400 focus:bg-white/10">
                    </label>
                    <label class="block">
                        <span class="mb-2 block text-sm font-medium text-slate-200">验证码 / 二次校验</span>
                        <input type="text" placeholder="后续扩展" class="w-full rounded-2xl border border-dashed border-white/10 bg-white/5 px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-400 focus:bg-white/10">
                    </label>
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 px-5 py-3 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:shadow-lg hover:shadow-blue-500/25">登录管理员后台</button>
                </form>
                <div class="mt-6 rounded-2xl border border-blue-400/20 bg-blue-400/10 p-4 text-sm leading-6 text-slate-300">
                    当前页面不保存账号信息，也不执行真实认证，仅作为后台入口预留页。
                </div>
            </section>
        </div>
    </main>
</body>
</html>
