name: Deploy CyberForgeCamp Docs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect GitHub Pages enablement token
        id: pages_token
        shell: bash
        env:
          PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
        run: |
          if [ -n "$PAGES_ENABLEMENT_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: ${{ steps.pages_token.outputs.has_token == 'false' }}
        uses: actions/configure-pages@v6

      - name: Configure and enable GitHub Pages
        if: ${{ steps.pages_token.outputs.has_token == 'true' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild repository-local documentation assets
        run: python build.py

      - name: Build MkDocs site
        run: python -m mkdocs build --strict

      - name: Commit refreshed event pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/home/index.md docs/05-Contest/events/index.md docs/05-Contest/events/Upcoming_events.md docs/05-Contest/events/Now_running.md docs/05-Contest/events/Past_events.md
          git diff --cached --quiet || git commit -m "Automatically update"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
